name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-test:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        example:
          - functional-basic
          - functional-currying
          - object-oriented

    defaults:
      run:
        working-directory: ${{ matrix.example }}

    env:
      CYPRESS_INSTALL_BINARY: 0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.example }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx jest --config=jest.config.js --ci
